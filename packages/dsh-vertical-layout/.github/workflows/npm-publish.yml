# Publish to npm using Trusted Publisher (OIDC), no npm token required
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # npx npm@latest guarantees npm >= 11.5.1 (OIDC trusted publishing requirement)
      - name: Publish
        run: npx -y npm@latest publish --provenance --access public
