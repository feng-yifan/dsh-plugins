# dsh-ask-highlight bundle patch：插入插件行。
# 插件经 webserver/index-inject 注入 <style>（row 类型 kind: 'style'），用稳定
# 属性选择器 [data-tool="ask_user_question"][data-state="ok"] 高亮对话线程里
# 已答复的提问块；开启「提问块默认展开」后再注入一段 <script>，把每个提问块
# 默认展开一次。
#
# 两个开关存在当前 profile 的 state.json（见 src/state.ts），由设置页
# （设置 → 插件 → 提问块高亮）读写，改完刷新页面即生效；这里的 config 只是
# 首次建立 state.json 时的种子值。
- insert:
    - id: dsh-ask-highlight
      name: dsh-ask-highlight
