# Publish workspace packages to npm using Trusted Publisher (OIDC), no npm token required.
#
# 发布：tag 名称 = 包名@版本（如 dsh-vertical-layout@1.1.0），版本须与
# packages/<name>/package.json 的 version 一致；也可用 workflow_dispatch 手动补发。
#
# 废弃标记不在这里做：npm 的 Trusted Publishing(OIDC) 只覆盖发布类命令，
# `npm deprecate` 走 OIDC 会因未认证返回 404（2026-10-10 在 npm 12.2.0 上实测）。
# 给包打 deprecated 标记请到 npmjs.com 包页 Settings → Deprecate，或在本地用有写权限的
# 凭据执行 `npm deprecate <pkg>@* "<说明>"`（撤销：消息传空串）。
#
# `dsh-font-settings` 已废弃（见 packages/dsh-font-settings/DEPRECATED.md）：不再接受其 tag 发布，
# 也不再出现在手动发布的包列表里。npmjs 上为 dsh-vertical-layout、dsh-ask-highlight
# 配置过 Trusted Publisher，GitHub 仓库选 feng-yifan/dsh-plugins，
# 见 https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  push:
    tags:
      - 'dsh-vertical-layout@*'
      - 'dsh-ask-highlight@*'
  workflow_dispatch:
    inputs:
      package:
        description: 要发布的包
        required: true
        type: choice
        options:
          - dsh-vertical-layout
          - dsh-ask-highlight

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Resolve package name
        id: pkg
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # tag 形如 dsh-vertical-layout@1.1.0，取 @ 前的包名
            echo "name=${GITHUB_REF_NAME%@*}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" run build
      # npx npm@latest guarantees npm >= 11.5.1 (OIDC trusted publishing requirement);
      # prepare 脚本会在发布前自动重新构建，tarball 以本次构建产物为准。
      - name: Publish
        working-directory: packages/${{ steps.pkg.outputs.name }}
        run: npx -y npm@latest publish --provenance --access public
