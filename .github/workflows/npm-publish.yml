# Publish workspace packages to npm using Trusted Publisher (OIDC), no npm token required.
#
# 发布：tag 名称 = 包名@版本（如 dsh-vertical-layout@1.1.0），版本须与
# packages/<name>/package.json 的 version 一致；也可用 workflow_dispatch 手动补发。
#
# 废弃标记不在这里做：npm 的 Trusted Publishing(OIDC) 只覆盖发布类命令，
# `npm deprecate` 走 OIDC 会因未认证返回 404（2026-10-10 在 npm 12.2.0 上实测）。
# 给包打 deprecated 标记请到 npmjs.com 包页 Settings → Deprecate，或在本地用有写权限的
# 凭据执行 `npm deprecate <pkg>@* "<说明>"`（撤销：消息传空串）。
#
# `dsh-font-settings` 已废弃（见 packages/dsh-font-settings/DEPRECATED.md）：不再接受其 tag 发布，
# 也不再出现在手动发布的包列表里。npmjs 上为 dsh-vertical-layout、dsh-ask-highlight、dsh-pwa-icon、dsh-enhancement
# 配置过 Trusted Publisher，GitHub 仓库选 feng-yifan/dsh-plugins，
# 见 https://docs.npmjs.com/trusted-publishers
#
# npm 现行政策（2026-10 观测）：新包的 Trusted Publisher 配置属「未验证」，创建后 48 小时内
# 没有首次成功发布会过期，需要重建；`pull_request_target` / `issue_comment` 事件被拒，
# `push` / `release` / `workflow_dispatch` 可用。详见 wiki 概念节点「概念-DSH插件版本适配」。

name: Publish to npm

on:
  push:
    tags:
      - 'dsh-vertical-layout@*'
      - 'dsh-ask-highlight@*'
      - 'dsh-pwa-icon@*'
      - 'dsh-enhancement@*'
  workflow_dispatch:
    inputs:
      package:
        description: 要发布的包
        required: true
        type: choice
        options:
          - dsh-vertical-layout
          - dsh-ask-highlight
          - dsh-pwa-icon
          - dsh-enhancement

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Resolve package name
        id: pkg
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # tag 形如 dsh-vertical-layout@1.1.0，取 @ 前的包名
            echo "name=${GITHUB_REF_NAME%@*}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" run build
      # npx npm@latest guarantees npm >= 11.5.1 (OIDC trusted publishing requirement);
      # Build 步骤已生成 lib，publish 跳过 prepare 以免重复构建。
      - name: Publish
        working-directory: packages/${{ steps.pkg.outputs.name }}
        # Build 步骤已产出 lib；跳过 prepare，避免 CI 里重复构建
        run: npx -y npm@latest publish --provenance --access public --ignore-scripts
