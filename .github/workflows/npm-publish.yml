# Publish workspace packages to npm using Trusted Publisher (OIDC), no npm token required.
#
# 发布：tag 名称 = 包名@版本（如 dsh-vertical-layout@1.1.0），版本须与
# packages/<name>/package.json 的 version 一致；也可用 workflow_dispatch 手动补发。
#
# 废弃（deprecate）：workflow_dispatch 选 action=deprecate + 填 message，对该包**全部版本**
# 打上 deprecated 标记（不改动已发布内容）。撤销需在本地执行 `npm deprecate <pkg>@* ""`，
# 本工作流只负责打标记。
#
# `dsh-font-settings` 已废弃（见 packages/dsh-font-settings/DEPRECATED.md）：不再接受其 tag 发布，
# 仅保留 deprecate 入口。npmjs 上为 dsh-vertical-layout、dsh-ask-highlight（历史上含
# dsh-font-settings）配置过 Trusted Publisher，GitHub 仓库选 feng-yifan/dsh-plugins，
# 见 https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  push:
    tags:
      - 'dsh-vertical-layout@*'
      - 'dsh-ask-highlight@*'
  workflow_dispatch:
    inputs:
      action:
        description: 操作（deprecate 时对该包全部版本打废弃标记，不发布）
        required: true
        type: choice
        default: publish
        options:
          - publish
          - deprecate
      package:
        description: 目标包（publish 时须与 tag/版本一致的包；dsh-font-settings 已废弃，仅可 deprecate）
        required: true
        type: choice
        options:
          - dsh-vertical-layout
          - dsh-ask-highlight
          - dsh-font-settings
      message:
        description: deprecate 说明（action=deprecate 时必填）
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    if: ${{ !inputs.action || inputs.action == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Resolve package name
        id: pkg
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # tag 形如 dsh-vertical-layout@1.1.0，取 @ 前的包名
            echo "name=${GITHUB_REF_NAME%@*}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter "${{ steps.pkg.outputs.name }}" run build
      # npx npm@latest guarantees npm >= 11.5.1 (OIDC trusted publishing requirement);
      # prepare 脚本会在发布前自动重新构建，tarball 以本次构建产物为准。
      - name: Publish
        working-directory: packages/${{ steps.pkg.outputs.name }}
        run: npx -y npm@latest publish --provenance --access public

  deprecate:
    if: ${{ inputs.action == 'deprecate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Mark every version deprecated
        env:
          PKG: ${{ inputs.package }}
          MSG: ${{ inputs.message }}
        run: |
          set -euo pipefail
          if [ -z "$MSG" ]; then
            echo "::error::input 'message' is required when action=deprecate"
            exit 1
          fi
          npx -y npm@latest deprecate "$PKG@*" "$MSG"
